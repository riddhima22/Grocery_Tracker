[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    ".venv",
    "venv",
    "migrations",
    "staticfiles",
    "media",
    "data",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
]
ignore = [
    "E501",  # line too long
]

[tool.ruff.lint.per-file-ignores]
"config/settings/*" = ["F403", "F405", "E402"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "common", "config", "integrations"]

[tool.coverage.run]
source = ["apps", "common", "integrations"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/tests.py",
    "*/wsgi.py",
    "*/asgi.py",
    "manage.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 0
