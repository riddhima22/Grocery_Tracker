name: Backend CI/CD

on:
  push:
    branches: [ backend, main ]
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements/*.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/development.txt

      - name: Run Ruff Lint Checks
        run: ruff check .

      - name: Run Django Tests with Coverage
        run: |
          coverage run manage.py test --settings=config.settings.development

      - name: Display Coverage Report
        run: coverage report

  docker:
    name: Build & Push Docker Image
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/backend')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Convert Repository Owner to Lowercase
        id: repo_owner
        run: |
          echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/freshtrack-backend:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/freshtrack-backend:${{ github.sha }}

      - name: Deploy to Render (CD Placeholder)
        # =========================================================================
        # Render Deployment Target
        # =========================================================================
        # To automate deployment to Render upon successful image build:
        # 1. In your Render Dashboard, select your Web Service -> Settings.
        # 2. Copy the "Deploy Hook" URL.
        # 3. Add it as a secret in your GitHub repo:
        #    Settings -> Secrets and variables -> Actions -> Repository secrets
        #    Name: RENDER_DEPLOY_HOOK_URL
        # 4. Uncomment the curl step below.
        # =========================================================================
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Deploy Target: Render"
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Triggering Render deployment hook..."
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "Render deployment triggered successfully."
          else
            echo "RENDER_DEPLOY_HOOK_URL secret not configured. Skipping automated deploy step."
            echo "See comments in .github/workflows/backend-ci.yml for setup instructions."
          fi
