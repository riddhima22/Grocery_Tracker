name: GroceryTrack Production Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Semantic Version Name (e.g. 1.0.0)'
        required: false
        type: string
      build_number:
        description: 'Build Number / Version Code (e.g. 1)'
        required: false
        type: string
      publish_to_playstore:
        description: 'Publish AAB to Google Play Console'
        required: false
        type: boolean
        default: false
      track:
        description: 'Google Play Release Track'
        required: false
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
        default: internal

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    name: Pre-Release Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK (3.41.9)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Validate Dart Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run Static Analysis
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Execute Full Test Suite
        run: flutter test

  build-release:
    name: Build Signed Production Artifacts
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Release Signing Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=()
          [ -z "$KEYSTORE_BASE64" ] && missing+=("KEYSTORE_BASE64")
          [ -z "$KEYSTORE_PASSWORD" ] && missing+=("KEYSTORE_PASSWORD")
          [ -z "$KEY_ALIAS" ] && missing+=("KEY_ALIAS")
          [ -z "$KEY_PASSWORD" ] && missing+=("KEY_PASSWORD")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required release signing secrets: ${missing[*]}"
            echo "Production release builds must be signed with a valid keystore and cannot fall back to debug signing."
            echo "Please configure the missing secrets in repository/environment settings."
            exit 1
          fi
          echo "All release signing secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) are present."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK (3.41.9)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-release-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-release-

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Decode Android Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app/keystores
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystores/release.keystore

      - name: Determine Version & Build Arguments
        id: versioning
        run: |
          BUILD_ARGS=""
          if [ -n "${{ github.event.inputs.build_name }}" ]; then
            BUILD_ARGS="$BUILD_ARGS --build-name=${{ github.event.inputs.build_name }}"
          fi
          if [ -n "${{ github.event.inputs.build_number }}" ]; then
            BUILD_ARGS="$BUILD_ARGS --build-number=${{ github.event.inputs.build_number }}"
          fi
          echo "build_args=$BUILD_ARGS" >> $GITHUB_OUTPUT

      - name: Build Signed Android App Bundle (AAB)
        env:
          KEYSTORE_PATH: android/app/keystores/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build appbundle --release ${{ steps.versioning.outputs.build_args }}

      - name: Build Signed Android APK
        env:
          KEYSTORE_PATH: android/app/keystores/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release ${{ steps.versioning.outputs.build_args }}

      - name: Upload Production AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: grocery-track-production-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload Production APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: grocery-track-production-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Publish to Google Play Console
        if: ${{ (github.event.inputs.publish_to_playstore == 'true' || startsWith(github.ref, 'refs/tags/v')) && env.PLAY_STORE_JSON_KEY != '' }}
        uses: r0adkll/upload-google-play@v1
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.example.grocery_track
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed
