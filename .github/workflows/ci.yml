name: FreshTrack CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Tests & Security Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: freshtrack_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements/development.txt

      - name: Run Security Deployment Check
        env:
          SECRET_KEY: ci-test-secret-key-1234567890
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/freshtrack_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd backend
          python manage.py check --deploy --settings=config.settings.production

      - name: Run Django Migrations & Tests
        env:
          SECRET_KEY: ci-test-secret-key-1234567890
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/freshtrack_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd backend
          python manage.py migrate --settings=config.settings.development
          python manage.py test --settings=config.settings.development

  flutter-test:
    name: Flutter Analyze & Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Flutter Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter Unit Tests
        run: flutter test
