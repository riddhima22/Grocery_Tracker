name: GroceryTrack CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend Lint, Security & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: freshtrack_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements/*.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements/development.txt

      - name: Run Production Security Deployment Check
        env:
          SECRET_KEY: ci-test-secret-key-1234567890
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/freshtrack_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd backend
          python manage.py check --deploy --settings=config.settings.production

      - name: Run Django Migrations & Full Test Suite
        env:
          SECRET_KEY: ci-test-secret-key-1234567890
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/freshtrack_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd backend
          python manage.py migrate --settings=config.settings.development
          python manage.py test apps.groceries apps.scans --settings=config.settings.development

  flutter-ci:
    name: Flutter Lint, Analyze, Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK (3.41.9)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Validate Dart Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run Flutter Static Analysis
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run Flutter Unit & Integration Tests
        run: flutter test --coverage

      - name: Upload Test Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-coverage-report
          path: coverage/lcov.info
          retention-days: 14

      - name: Build Debug Android APK
        run: flutter build apk --debug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: grocery-track-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
