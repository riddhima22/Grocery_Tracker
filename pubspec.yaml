    sdk: flutter

  cupertino_icons: ^1.0.8

# State Management
  provider: ^6.1.2

# Token security
  flutter_secure_storage: ^9.2.2

#  Firebase
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
