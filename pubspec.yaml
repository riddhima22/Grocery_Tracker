  logger: ^2.5.0
  flutter_dotenv: ^5.2.1
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.3


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
